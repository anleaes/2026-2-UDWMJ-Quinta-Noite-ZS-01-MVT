{% extends 'base.html' %}

{% block title %}

Adicionar Pedido - {{ block.super }}

{% endblock title %}

{% block body %}

<br />
<b>Cadastro de Pedido</b>
<br />
<br />
<form action="" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <label>Participante</label>
    <br />
    {{ form.participante }}
    <br />
    <br />
    <label>Cupom</label>
    <br />
    {{ form.cupom }}
    <br />
    <br />
    <label>Data do pedido</label>
    <br />
    {{ form.data_pedido }}
    <br />
    <br />
    <label>Valor total</label>
    <br />
    {{ form.valor_total }}
    <br />
    <br />
    <label>Status</label>
    <br />
    {{ form.status }}
    <br />
    <br />
    <button type="submit">Salvar</button>
</form>

{% endblock body %}
