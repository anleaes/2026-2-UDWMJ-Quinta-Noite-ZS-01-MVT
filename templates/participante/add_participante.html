{% extends 'base.html' %}

{% block title %}

Adicionar Participante - {{ block.super }}

{% endblock title %}

{% block body %}

<br />
<b>Cadastro de Participante</b>
<br />
<br />
<form action="" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <label>Nome</label>
    <br />
    {{ form.nome }}
    <br />
    <br />
    <label>CPF</label>
    <br />
    {{ form.cpf }}
    <br />
    <br />
    <label>E-mail</label>
    <br />
    {{ form.email }}
    <br />
    <br />
    <label>Data de nascimento</label>
    <br />
    {{ form.data_nascimento }}
    <br />
    <br />
    <label>Foto</label>
    <br />
    {{ form.foto }}
    <br />
    <br />
    <button type="submit">Salvar</button>
</form>

{% endblock body %}
