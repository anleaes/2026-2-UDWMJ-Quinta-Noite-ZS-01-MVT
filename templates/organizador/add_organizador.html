{% extends 'base.html' %}

{% block title %}

Adicionar Organizador - {{ block.super }}

{% endblock title %}

{% block body %}

<br />
<b>Cadastro de Organizador</b>
<br />
<br />
<form action="" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <label>Nome</label>
    <br />
    {{ form.nome }}
    <br />
    <br />
    <label>E-mail</label>
    <br />
    {{ form.email }}
    <br />
    <br />
    <label>Telefone</label>
    <br />
    {{ form.telefone }}
    <br />
    <br />
    <label>Logo</label>
    <br />
    {{ form.logo }}
    <br />
    <br />
    <button type="submit">Salvar</button>
</form>

{% endblock body %}
