{% extends 'base.html' %}

{% block title %}

Adicionar Check-in - {{ block.super }}

{% endblock title %}

{% block body %}

<br />
<b>Cadastro de Check-in</b>
<br />
<br />
<form action="" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <label>Ingresso</label>
    <br />
    {{ form.ingresso }}
    <br />
    <br />
    <label>Data e hora</label>
    <br />
    {{ form.data_hora }}
    <br />
    <br />
    <label>Portão</label>
    <br />
    {{ form.portao }}
    <br />
    <br />
    <label>Observação</label>
    <br />
    {{ form.observacao }}
    <br />
    <br />
    <button type="submit">Salvar</button>
</form>

{% endblock body %}
