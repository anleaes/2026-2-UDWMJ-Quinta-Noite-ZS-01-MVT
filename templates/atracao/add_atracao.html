{% extends 'base.html' %}

{% block title %}

Adicionar Atração - {{ block.super }}

{% endblock title %}

{% block body %}

<br />
<b>Cadastro de Atração</b>
<br />
<br />
<form action="" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <label>Nome</label>
    <br />
    {{ form.nome }}
    <br />
    <br />
    <label>Descrição</label>
    <br />
    {{ form.descricao }}
    <br />
    <br />
    <label>Cachê</label>
    <br />
    {{ form.cache }}
    <br />
    <br />
    <label>Foto</label>
    <br />
    {{ form.foto }}
    <br />
    <br />
    <button type="submit">Salvar</button>
</form>

{% endblock body %}
